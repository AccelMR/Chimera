; Engine defaults. Each value can be changed, from lowest to highest priority, in
; <Project>/Config/Engine.ini, /Saved/Config/Engine.ini and on the command line
; (-Section.Key=Value, e.g. -Window.Width=1280).
; The values below are commented out because the code already uses them.

[Application]
;Name=Chimera Engine
; Wayland app_id / X11 class for window rules; empty uses chimera-editor or chimera-engine.
;Id=

[Window]
;Title=Chimera Engine Windowed Application
; In screen units; without both the window opens maximized at the display size.
;Width=0
;Height=0
;Maximized=false
; Milliseconds without a size change before the swap chain follows the window; 0 follows every change.
;ResizeDelay=150

[Graphics]
; Plugin name; without it the build picks the default (CH_DEFAULT_GRAPHICS_API).
;API=chVulkan
;VSync=false
; On by default only in debug builds.
;ValidationLayer=true

[Renderer]
; Lit, LitWireframe, Wireframe, Unlit, Normals, Depth, TexCoords, a GBuffer channel:
; BaseColor, Metallic, Roughness, AmbientOcclusion or Emissive, ScreenSpaceAO (what SSAO
; measures), ShadowCascades or ShadowMaps.
;ViewMode=Lit
; How the Lit view modes light the scene: Forward or Deferred.
;RenderPath=Deferred
; Multiplies the scene light before the tonemap curve.
;Exposure=1.0
; Light that reaches every surface from all sides, scaled by the material occlusion.
;Ambient=0.03
; Lights with Cast Shadows draw shadows (directional and spot).
;Shadows=true
; Parts of the lighting that can be turned off to see what each one adds or costs.
;NormalMaps=true
;OcclusionMaps=true
;Emissive=true
;DirectionalLights=true
;PointLights=true
;SpotLights=true
; The ACES curve of the tonemap; false only clamps the exposed color.
;Tonemap=true
; Comma separated optional passes that do not run: ShadowDepth, SpotShadowDepth, GBuffer,
; DeferredLighting, Forward, WireframeOverlay. They still clear their outputs.
;DisabledPasses=
; Width and height in texels of each cascade of the directional shadow map.
;ShadowMapSize=2048
; How far from the camera, in world units, the directional shadow reaches. A bigger
; distance spreads the same texels over more ground, so shadows get blurrier.
;ShadowDistance=200.0
; How many maps (1 to 4) split the shadow distance, the nearest one the sharpest.
;ShadowCascades=4
; Where the cascades split: 0 even steps, 1 steps that grow with the distance.
;ShadowSplitLambda=0.8
; Fraction of each cascade, at its far end, that blends into the next one. 0 cuts sharply.
;ShadowCascadeBlend=0.15
; Fraction of the shadow distance, at its far end, where the shadow fades out.
;ShadowFade=0.2
; Texels around each pixel the shadow test blends (0 to 3; 1 is a 3x3 filter).
;ShadowFilterRadius=1
; Texels of its cascade a receiver moves along its normal before the test.
;ShadowNormalOffset=1.5
; Depth bias of the shadow casters: constant, and growing with the slope.
;ShadowDepthBias=1.0
;ShadowSlopeBias=2.0
; How many spot lights (0 to 16) draw shadows in one frame; the ones that cover the most
; of the screen (range over distance to the camera) win.
;SpotShadowMaxLights=8
; Width and height in texels of the shadow map of each spot light.
;SpotShadowMapSize=1024
; How far from the camera, in world units, the range of a spot light may start and still
; draw its shadow.
;SpotShadowDistance=100.0
; Fraction of the spot shadow distance, at its far end, where spot shadows fade out.
;SpotShadowFade=0.2
; Distance from a spot light to the near plane of its shadow map.
;SpotShadowNearPlane=0.1
; Texels around each pixel the spot shadow test blends (0 to 3).
;SpotShadowFilterRadius=1
; Texels of the spot map, at the distance of the receiver, it moves along its normal.
;SpotShadowNormalOffset=1.5
; Depth bias of the spot shadow casters: constant, and growing with the slope.
;SpotShadowDepthBias=1.0
;SpotShadowSlopeBias=2.0
; How many point lights (0 to 8) draw shadows in one frame; each draws six cube faces.
;PointShadowMaxLights=4
; Width and height in texels of each cube face of a point light's shadow map (256 to 2048).
;PointShadowMapSize=512
; How far from the camera, in world units, the range of a point light may start and still
; draw its shadow.
;PointShadowDistance=100.0
; Fraction of the point shadow distance, at its far end, where point shadows fade out.
;PointShadowFade=0.2
; Distance from a point light to the near plane of its cube faces.
;PointShadowNearPlane=0.1
; Texels around each pixel the point shadow test blends (0 to 3).
;PointShadowFilterRadius=1
; Texels of the cube face, at the distance of the receiver, it moves along its normal.
;PointShadowNormalOffset=1.5
; Depth bias of the point shadow casters: constant, and growing with the slope.
;PointShadowDepthBias=1.0
;PointShadowSlopeBias=2.0
; The sky light lights the scene with its image; off, or without a sky light, the constant
; Ambient is used.
;IBL=true
; Width and height of each face of the cube the sky image is turned into (64 to 2048).
;IBLCubeSize=512
; Each face of the irradiance cube (diffuse light, 8 to 128) and its samples per texel.
;IBLIrradianceSize=32
;IBLIrradianceSamples=512
; Sharpest mip of the prefiltered cube (reflections, 32 to 1024), its mips from roughness 0
; to 1 (2 to 10), and its GGX samples per texel.
;IBLPrefilterSize=256
;IBLPrefilterMips=6
;IBLPrefilterSamples=256
; Width and height of the split sum lookup table of the image based lighting (32 to 1024).
;IBLBrdfLutSize=128
; GGX samples per texel of that table (16 to 8192); it is built once.
;IBLBrdfLutSamples=512
; The deferred path darkens the ambient light where nearby surfaces hide it (ground truth
; ambient occlusion measured on the depth of the frame).
;SSAO=true
; Computes it at half the width and height, about a third of the cost.
;SSAOHalfResolution=false
; How far around each pixel, in world units, surfaces occlude it.
;SSAORadius=1.0
; Fraction of the radius (0 to 1) over which far occluders fade out.
;SSAOFalloff=0.6
; Directions around each pixel (1 to 8) and depth samples on each side of one (1 to 16).
;SSAOSlices=3
;SSAOSteps=4
; Power applied to the visibility (0.5 to 4); above 1 darkens the occlusion.
;SSAOPower=2.2
; Largest radius on screen, in pixels (16 to 1024).
;SSAOMaxPixelRadius=256
; Texels on each side the blur averages (0 to 6, 0 is off), and how far from the surface,
; as a fraction of its distance, the blur and the scale up still blend (0.001 to 1).
;SSAOBlurRadius=2
;SSAODepthTolerance=0.05
; Occluded surfaces get back the light that bounces between them (material occlusion too).
;AOMultiBounce=true
; Draws the debug lines of the scene and of the editor (bounds, shapes) over the image.
; Both exist only when built with the CMake option CH_ENABLE_DEBUG_DRAW (off for shipping).
;DebugLines=true
; Most debug lines one list keeps between two clears (1 to 1048576); more are dropped.
;DebugLinesMax=65536

[Profiler]
; Seconds the profiler averages its scope times over before showing them.
;UpdateInterval=0.5
