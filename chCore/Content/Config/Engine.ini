; Engine defaults. Each value can be changed, from lowest to highest priority, in
; <Project>/Config/Engine.ini, /Saved/Config/Engine.ini and on the command line
; (-Section.Key=Value, e.g. -Window.Width=1280).
; The values below are commented out because the code already uses them.

[Application]
;Name=Chimera Engine

[Window]
;Title=Chimera Engine Windowed Application
;Width=2560
;Height=1440

[Graphics]
; Plugin name; without it the build picks the default (CH_DEFAULT_GRAPHICS_API).
;API=chVulkan
;VSync=false
;ValidationLayer=true

[Renderer]
; Lit, LitWireframe, Wireframe, Unlit, Normals, Depth, TexCoords, a GBuffer channel:
; BaseColor, Metallic, Roughness, AmbientOcclusion or Emissive, or ShadowCascades.
;ViewMode=Lit
; How the Lit view modes light the scene: Forward or Deferred.
;RenderPath=Deferred
; Multiplies the scene light before the tonemap curve.
;Exposure=1.0
; Light that reaches every surface from all sides, scaled by the material occlusion.
;Ambient=0.03
; Directional lights with Cast Shadows draw shadows.
;Shadows=true
; Width and height in texels of each cascade of the directional shadow map.
;ShadowMapSize=2048
; How far from the camera, in world units, the directional shadow reaches. A bigger
; distance spreads the same texels over more ground, so shadows get blurrier.
;ShadowDistance=200.0
; How many maps (1 to 4) split the shadow distance, the nearest one the sharpest.
;ShadowCascades=4
; Where the cascades split: 0 even steps, 1 steps that grow with the distance.
;ShadowSplitLambda=0.8
; Fraction of each cascade, at its far end, that blends into the next one. 0 cuts sharply.
;ShadowCascadeBlend=0.15
; Fraction of the shadow distance, at its far end, where the shadow fades out.
;ShadowFade=0.2
; Texels around each pixel the shadow test blends (0 to 3; 1 is a 3x3 filter).
;ShadowFilterRadius=1
; Texels of its cascade a receiver moves along its normal before the test.
;ShadowNormalOffset=1.5
; Depth bias of the shadow casters: constant, and growing with the slope.
;ShadowDepthBias=1.0
;ShadowSlopeBias=2.0
