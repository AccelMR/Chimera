; Input actions: what the player can do, and the keys that do it. The engine defines none;
; a project lists its own in <Project>/Config/Input.ini, and the player's changes go to
; /Saved/Config/Input.ini (only the Keys of actions that differ from these).
;
; One section per action:
;   [Move]
;   Type=Axis2D                  Button (default), Axis1D or Axis2D
;   Keys=W:+Y, S:-Y, D:+X, A:-X, GamepadLeftStick
;   Context=Gameplay             optional; game code turns contexts on and off
;
; A key is written Key[:Target][*Scale]:
;   Key     a name such as Space, LeftShift, Num1, MouseLeft, MouseWheelUp, MouseDelta,
;           GamepadSouth, GamepadLeftTrigger, GamepadLeftStick (see chInputKey.h)
;   Target  where the value goes in an axis action: +X, -X, +Y or -Y (Axis1D also takes
;           + and -). Buttons and one-axis keys need it in an Axis2D action.
;   Scale   multiplies the value, e.g. GamepadRightStick*4
;
; Axes that go up and down (stick Y, mouse Y) are positive upward. Keys held together in
; an axis action do not add up past their largest scale, so diagonals are not faster.
