; Input actions of the example project (format in the engine's Config/Input.ini).

[Move]
Type=Axis2D
Keys=W:+Y, S:-Y, D:+X, A:-X, Up:+Y, Down:-Y, Right:+X, Left:-X, GamepadLeftStick

[Look]
Type=Axis2D
Keys=MouseDelta*0.1, GamepadRightStick*3

[Jump]
Type=Button
Keys=Space, GamepadSouth

[Sprint]
Type=Button
Keys=LeftShift, GamepadLeftStickButton

[Zoom]
Type=Axis1D
Keys=MouseWheel, GamepadRightTrigger, GamepadLeftTrigger:-

[Pause]
Keys=P, GamepadStart
Context=Menu
