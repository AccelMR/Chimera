; Editor defaults. Each value can be changed, from lowest to highest priority, in
; <Project>/Config/Editor.ini, /Saved/Config/Editor.ini and on the command line
; (-Section.Key=Value, e.g. -Editor.FloatingWindows).
; The values below are commented out because the code already uses them.

[Editor]
;FloatingWindows=false
;StartupScene=DefaultScene
;CameraSpeed=5
;CameraLookSensitivity=0.15
;CameraSprintMultiplier=3
;CameraFieldOfView=90
;CameraNearPlane=0.1
;CameraFarPlane=10000
;Theme=CatppuccinMocha
;Font=JetBrainsMono
;FontSize=20
;UIScale=1
;UIOpacity=0.92
; The Profiler window, the frame stats in the corner of the viewport, and the frames per
; second in a corner while F11 hides the editor.
;ShowProfiler=false
;ShowStats=false
;ShowFullscreenFPS=true
; The Asset Inspector window (what the asset double clicked in the Content Browser holds).
;ShowAssetInspector=true
; The Animation Preview window and how it shows a model: bones, grid, the key light (the
; fill light gets a third), degrees turned per pixel dragged, closer per wheel step.
;ShowAnimationPreview=false
;PreviewSkeleton=true
;PreviewGrid=true
;PreviewLightIntensity=3
;PreviewOrbitSensitivity=0.3
;PreviewZoomStep=1.15
; Content Browser thumbnails of models, materials and prefabs: pixels per side, horizontal
; field of view in degrees, the key light (the fill light gets a third).
;ThumbnailSize=256
;ThumbnailFieldOfView=30
;ThumbnailLightIntensity=3
; Boxes around what the selected objects draw: world bounds and the mesh's own box.
;ShowBounds=false
; Lines along the bones of the selected models that have a skeleton.
;ShowSkeleton=false
; Width in pixels of the viewport border while playing (green) or paused (yellow); 0 = none.
;PlayBorderThickness=3
; Code editor scripts open in, given the project folder and the script (code, codium,
; cursor, or a full path). Empty, or not found on the PATH, uses the system's program.
;ScriptEditor=code
; The ground grid of the viewport (z = 0); with adaptive spacing the cells grow ten times
; at a time wherever they would look smaller than GridMinCellPixels.
;Grid=true
;GridSpacing=1
;GridAdaptive=true
;GridMinCellPixels=12
;GridFadeDistance=500
;GridOpacity=0.5
